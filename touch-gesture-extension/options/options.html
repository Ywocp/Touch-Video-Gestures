<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch Video Gestures：触控视频手势 - 设置面板</title>
  <link rel="stylesheet" href="shared.css">
</head>
<body class="page-mode">
  <header>
    <h1>Touch Video Gestures：触控视频手势</h1>
    <div class="sub">所有改动即时生效并保存，正在播放的页面无需刷新</div>
    <div class="presets">
      <button data-preset="mild">轻度</button>
      <button data-preset="standard">标准</button>
      <button data-preset="aggressive">激进</button>
      <button data-preset="reset">恢复默认</button>
    </div>
  </header>

  <div id="form"></div>

  <footer>
    <span class="note">点浏览器工具栏的扩展图标也可随时调参</span>
    <button class="ghost" id="copyConfig">导出配置</button>
    <span id="tip">已保存</span>
  </footer>

  <script src="options.js"></script>
</body>
</html>
